[package]
name = "http_traits"
version = "0.1.0"
edition = "2024"

[features]
reqwest = ["dep:reqwest"]
ehttp = ["dep:ehttp", "dep:thiserror", "dep:serde_json", "dep:http-auth-basic", "dep:serde_urlencoded", "dep:mime_guess", "dep:mime"]

[dependencies]
http = "1.4.0"
url = "2.5.7"
serde = "1.0.228"
serde_urlencoded = { version = "0.7.1", optional = true}
serde_json = { version = "1.0.149", optional = true }
ehttp = { version = "0.6.0", optional = true, features = ["json", "multipart", "native-async"]}
reqwest = { version = "0.13.1", optional = true, features = ["query", "json", "multipart", "stream"] }
bytes = "1.11.0"
thiserror = { version = "2.0.18", optional = true }
http-auth-basic = { version = "0.3.7", optional = true }
mime_guess = { version = "2.0.5", optional = true }
mime = { version = "0.3.17", optional = true}